<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB VIEWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <canvas id="particles"></canvas>
  <div class="grid-overlay"></div>
  <div class="scanlines"></div>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="16,2 30,10 30,22 16,30 2,22 2,10" stroke="#0af" stroke-width="1.5"/>
          <polyline points="16,2 16,16 30,22" stroke="#0af" stroke-width="1"/>
          <line x1="16" y1="16" x2="2" y2="22" stroke="#0af" stroke-width="1"/>
        </svg>
      </div>
      <span>GLB_VIEWER_ONLINE</span>
  </header>

  <div id="three-container"></div>
  <div id="status-bar">GLB_VIEWER // STANDBY // AWAITING_DATA</div>
  <div id="credit">MADE BY BOBAKA</div>
  <div id="toast">✓ SYSTEM READY</div>

  <div id="drop-overlay">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">⬡</div>
      <div class="drop-title">ЗАРЕДИ GLB ФАЙЛ</div>
      <div class="drop-sub">ПЛЪЗНИ И ПУСНИ ИЛИ НАТИСНИ ЗА ИЗБОР</div>
      <input type="file" id="file-input" accept=".glb,.gltf">
    </div>
    <button class="btn" id="browse-btn">◈ &nbsp; ИЗБЕРИ ФАЙЛ</button>
  </div>

  <div id="loader">
    <div class="loader-text" id="loader-text">ЗАРЕЖДАНЕ НА МОДЕЛ...</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar"></div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="reset-btn">⟳ &nbsp; RESET</button>
    <button class="btn active" id="rotate-btn">⟁ &nbsp; АВТО-РОТАЦИЯ</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
